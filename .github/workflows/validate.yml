name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 = the declared support floor: the hacs.json floor is HA 2026.7,
        # which declares requires-python >= 3.14.2. A 3.13 leg would resolve a
        # pre-2026.7 HomeAssistant that has no UnitOfDensity/UnitOfRatio and
        # could only ever fail on import, so the floor and the ceiling are the
        # same interpreter for now. Kept as a matrix so a second leg can be
        # added when HA next raises its Python floor.
        python-version: ["3.14"]
        # requirements_test.txt pins the latest pyairnow (Dependabot keeps it
        # current). The manifest declares a version *floor* (pyairnow>=1.3.1),
        # so both ends of that range must stay proven: the "floor" leg
        # reinstalls the oldest version the manifest admits — read from
        # manifest.json itself, so this leg cannot drift from what users may
        # actually resolve.
        pyairnow: ["floor", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - name: Downgrade pyairnow to the manifest floor
        if: matrix.pyairnow == 'floor'
        run: |
          python - <<'PYEOF'
          import json
          import re
          import subprocess

          with open("custom_components/airnow_station/manifest.json") as f:
              requirements = json.load(f)["requirements"]
          (req,) = [r for r in requirements if r.startswith("pyairnow")]
          match = re.fullmatch(r"pyairnow>=([0-9.]+)", req)
          if match is None:
              raise SystemExit(
                  f"cannot derive a floor from {req!r}; update this step"
              )
          subprocess.check_call(["pip", "install", f"pyairnow=={match.group(1)}"])
          PYEOF
      - run: pytest tests -q --cov=custom_components.airnow_station --cov-fail-under=95

  # Proves the floor declared in hacs.json is real. The other gates resolve
  # the LATEST Home Assistant, so code could start depending on a newer API
  # while HACS keeps offering the release to users on the declared floor.
  # Reads the floor from hacs.json and the integration's own requirements
  # from manifest.json, then imports every module and type-checks against
  # that exact release.
  #
  # This is also the only mypy run. HA 2026.9 moved core to probatio and
  # 2026.10 retyped schema arguments as probatio.Schema, so mypy against the
  # latest HA rejects the voluptuous schemas older releases need (probatio
  # does not exist before 2026.9). HA still accepts voluptuous schemas at
  # runtime, and the test job covers runtime on the newest HA.
  minimum-supported-ha:
    name: Minimum supported HA (hacs.json floor)
    runs-on: ubuntu-latest
    env:
      # Must satisfy the floor's requires-python (HA 2026.7.0 = Python
      # 3.14.2+), and stay below 3.15: uv would otherwise pick CPython 3.15, where
      # HA 2026.7.0's pinned Pillow has no wheel.
      FLOOR_PYTHON: ">=3.14.2,<3.15"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pin the floor and the integration's requirements
        run: |
          python3 - <<'PY'
          import json
          floor = json.load(open("hacs.json"))["homeassistant"]
          reqs = json.load(open("custom_components/airnow_station/manifest.json"))["requirements"]
          with open("floor-requirements.txt", "w") as f:
              f.write("\n".join([f"homeassistant=={floor}", "voluptuous", *reqs]) + "\n")
          print(f"Declared Home Assistant floor: {floor}; requirements: {reqs}")
          PY

      - name: Import every module against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            python -c "
          import importlib, pkgutil
          import custom_components.airnow_station as pkg
          names = [m.name for m in pkgutil.iter_modules(pkg.__path__)]
          for name in names:
              importlib.import_module(f'{pkg.__name__}.{name}')
          print(f'{len(names)} modules import on the declared floor')
          "

      - name: Mypy (strict) against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            --with mypy \
            mypy custom_components/airnow_station/
